# One-command local deployment: Postgres + FastAPI backend + React/nginx frontend.
# Run with:  docker compose up --build
# Frontend:  http://localhost:5173
# API docs:  http://localhost:8000/docs
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blogsphere
      POSTGRES_PASSWORD: blogsphere
      POSTGRES_DB: blogsphere
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blogsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      DATABASE_URL: postgresql+psycopg2://blogsphere:blogsphere@db:5432/blogsphere
      CORS_ORIGINS: http://localhost:5173
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  uploads_data:
